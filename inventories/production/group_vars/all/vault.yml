---
# Encrypt this file before deploying:
#   ansible-vault encrypt inventories/production/group_vars/all/vault.yml
#
# Edit after encrypting:
#   ansible-vault edit inventories/production/group_vars/all/vault.yml

vault_grafana_admin_password: "CHANGE_ME_before_deploy"
vault_grafana_secret_key: "CHANGE_ME_min_32_chars_secret_key!"

# Telegram bot — create via @BotFather, then add bot to your group/channel
vault_telegram_bot_token: "YOUR_BOT_TOKEN_HERE"
# For a group: negative number like -1001234567890
# For a user DM: positive number like 123456789
vault_telegram_chat_id: "YOUR_CHAT_ID_HERE"

# PostgreSQL DSN for postgres_exporter
# Override per-host in host_vars/<hostname>/vault.yml if DSNs differ
vault_postgres_dsn: "postgresql://postgres_exporter:password@localhost:5432/postgres?sslmode=disable"
