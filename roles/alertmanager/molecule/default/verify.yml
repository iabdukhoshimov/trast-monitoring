---
- name: Verify
  hosts: all
  tasks:
    - name: Check alertmanager service is running
      ansible.builtin.systemd:
        name: alertmanager
      register: svc

    - name: Assert service active
      ansible.builtin.assert:
        that: svc.status.ActiveState == "active"
        fail_msg: "alertmanager service is not active"

    - name: Check port 9093 is listening
      ansible.builtin.wait_for:
        port: 9093
        timeout: 10

    - name: Check health endpoint
      ansible.builtin.uri:
        url: "http://localhost:9093/-/healthy"
        status_code: 200
