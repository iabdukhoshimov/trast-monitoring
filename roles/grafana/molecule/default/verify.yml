---
- name: Verify
  hosts: all
  vars:
    grafana_admin_user: "admin"
    grafana_admin_password: "molecule-test-password"
  tasks:
    - name: Check grafana service is running
      ansible.builtin.systemd:
        name: grafana-server
      register: svc

    - name: Assert service active
      ansible.builtin.assert:
        that: svc.status.ActiveState == "active"
        fail_msg: "grafana-server service is not active"

    - name: Check port 3000 is listening
      ansible.builtin.wait_for:
        port: 3000
        timeout: 30

    - name: Check health endpoint
      ansible.builtin.uri:
        url: "http://localhost:3000/api/health"
        status_code: 200
      retries: 10
      delay: 3

    - name: Check datasource provisioning file exists
      ansible.builtin.stat:
        path: /etc/grafana/provisioning/datasources/datasources.yml
      register: ds

    - name: Assert datasource config exists
      ansible.builtin.assert:
        that: ds.stat.exists

    - name: Check Prometheus datasource is provisioned
      ansible.builtin.uri:
        url: "http://localhost:3000/api/datasources/name/Prometheus"
        user: "{{ grafana_admin_user }}"
        password: "{{ grafana_admin_password }}"
        force_basic_auth: true
        status_code: 200
      no_log: true

    - name: Check Loki datasource is provisioned
      ansible.builtin.uri:
        url: "http://localhost:3000/api/datasources/name/Loki"
        user: "{{ grafana_admin_user }}"
        password: "{{ grafana_admin_password }}"
        force_basic_auth: true
        status_code: 200
      no_log: true
