---
- name: Create grafana system group
  ansible.builtin.group:
    name: "{{ grafana_group }}"
    system: true

- name: Create grafana system user
  ansible.builtin.user:
    name: "{{ grafana_user }}"
    group: "{{ grafana_group }}"
    system: true
    shell: /sbin/nologin
    create_home: false

- name: Run install tasks
  ansible.builtin.import_tasks: install.yml
- name: Run configure tasks
  ansible.builtin.import_tasks: configure.yml
- name: Run service tasks
  ansible.builtin.import_tasks: service.yml
- name: Run dashboards tasks
  ansible.builtin.import_tasks: dashboards.yml
- name: Run firewall tasks
  ansible.builtin.import_tasks: firewall.yml
