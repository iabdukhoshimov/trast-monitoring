---
- name: Verify
  hosts: all
  tasks:
    - name: Check loki service is running
      ansible.builtin.systemd:
        name: loki
      register: svc

    - name: Assert service active
      ansible.builtin.assert:
        that: svc.status.ActiveState == "active"
        fail_msg: "loki service is not active"

    - name: Check port 3100 is listening
      ansible.builtin.wait_for:
        port: 3100
        timeout: 30

    - name: Check loki ready endpoint
      ansible.builtin.uri:
        url: "http://localhost:3100/ready"
        status_code: 200
      retries: 10
      delay: 3
