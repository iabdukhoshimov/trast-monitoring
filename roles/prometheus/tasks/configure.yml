---
- name: Write prometheus config
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ prometheus_config_dir }}/prometheus.yml"
    owner: "{{ prometheus_user }}"
    group: "{{ prometheus_group }}"
    mode: "0644"
    validate: "{{ prometheus_install_dir }}/promtool check config %s"
  notify: Reload prometheus

- name: Write alerting rules
  ansible.builtin.template:
    src: alerting_rules.yml.j2
    dest: "{{ prometheus_rules_dir }}/alerting_rules.yml"
    owner: "{{ prometheus_user }}"
    group: "{{ prometheus_group }}"
    mode: "0644"
    validate: "{{ prometheus_install_dir }}/promtool check rules %s"
  notify: Reload prometheus

- name: Write recording rules
  ansible.builtin.template:
    src: recording_rules.yml.j2
    dest: "{{ prometheus_rules_dir }}/recording_rules.yml"
    owner: "{{ prometheus_user }}"
    group: "{{ prometheus_group }}"
    mode: "0644"
    validate: "{{ prometheus_install_dir }}/promtool check rules %s"
  notify: Reload prometheus
