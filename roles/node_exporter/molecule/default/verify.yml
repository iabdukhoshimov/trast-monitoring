---
- name: Verify
  hosts: all
  tasks:
    - name: Check node_exporter service is running
      ansible.builtin.systemd:
        name: node_exporter
      register: svc

    - name: Assert service active
      ansible.builtin.assert:
        that: svc.status.ActiveState == "active"
        fail_msg: "node_exporter service is not active"

    - name: Check port 9100 is listening
      ansible.builtin.wait_for:
        port: 9100
        timeout: 10

    - name: Check metrics endpoint responds
      ansible.builtin.uri:
        url: "http://localhost:9100/metrics"
        status_code: 200
